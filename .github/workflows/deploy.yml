name: Deploy Nira Clinic to AWS S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::844099234482:role/GitHubActions-NiraClinic
          aws-region: ca-central-1

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://nira-clinic-frontend-2026 \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"
